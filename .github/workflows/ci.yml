name: MedLens CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Safety Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx pytest pytest-cov

      - name: Run MedLens Core Unit Tests
        run: |
          python backend/test_medlens.py

      - name: Run End-to-End Integration & Security Tests
        run: |
          python backend/test_integration_pipeline.py

  frontend-tests:
    name: Frontend Test Suite & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci --legacy-peer-deps || npm --prefix frontend install --legacy-peer-deps

      - name: Run Vitest Unit Tests
        run: |
          npm --prefix frontend test

      - name: Build Frontend Production Bundle
        run: |
          npm --prefix frontend run build
