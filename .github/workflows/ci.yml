name: MedLens CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-and-tests:
    name: Backend Linting, Type Invariants & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies & Linters
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx pytest pytest-cov ruff

      - name: Run Ruff Linter & Format Check
        run: |
          ruff check backend/

      - name: Run Test Suite with Pytest Coverage
        run: |
          pytest --cov=backend --cov-report=term --cov-report=xml backend/test_medlens.py backend/test_integration_pipeline.py

  frontend-quality-and-build:
    name: Frontend Linting, Unit Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci --legacy-peer-deps || npm --prefix frontend install --legacy-peer-deps

      - name: Run Vitest Unit Tests
        run: |
          npm --prefix frontend test

      - name: Build Frontend Production Bundle
        run: |
          npm --prefix frontend run build
